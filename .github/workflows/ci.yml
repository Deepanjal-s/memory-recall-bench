name: CI

on: [push, pull_request]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
        python: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install -e ".[dev]"
      - run: pytest -q
      - run: mrb --limit 6 --budgets 1k,4k

  llamaindex:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,llamaindex]"
      - run: pytest -q tests/test_llamaindex.py

  embeddings:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev]" numpy   # tests use a toy encoder; no model download
      - run: pytest -q tests/test_embeddings.py

  mem0:
    runs-on: ubuntu-latest
    env:
      MEM0_TELEMETRY: "False"
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install -e ".[dev,mem0]"
      - run: python -m spacy download en_core_web_sm
      - run: pytest -q tests/test_mem0.py   # downloads bge-small and Qdrant/bm25 (fastembed)

  action:
    # End-to-end test of the published GitHub Action (action.yml) on 30 LongMemEval questions.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/longmemeval_s_cleaned.json
          key: longmemeval-s-cleaned-v1
      - run: |
          f="${{ runner.temp }}/longmemeval_s_cleaned.json"
          [ -s "$f" ] || curl -sSfL -o "$f" https://huggingface.co/datasets/xiaowu0162/longmemeval-cleaned/resolve/main/longmemeval_s_cleaned.json
          pip install -q .
          mrb export --data "$f" --limit 30 --out convs.jsonl
          python scripts/bm25_rankings.py convs.jsonl rankings.json
      - uses: ./
        with:
          rankings: rankings.json
          limit: "30"
          budget: 4k
          min-recall: "0.5"
